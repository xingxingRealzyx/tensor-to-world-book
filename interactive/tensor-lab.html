<script id="tensor-engine">
/* Pure numerical functions: no DOM, network, random values, or learned weights. */
(() => {
  'use strict';
  const range = n => Array.from({length:n}, (_,i) => i);
  const index = (v,n,name) => { if (!Number.isInteger(v)||v<0||v>=n) throw new RangeError(name); return v; };
  function multiply(a,b) {
    if (!a.length || !b.length || a.some(r=>r.length!==b.length) || b.some(r=>r.length!==b[0].length)) throw new Error('matrix dimensions');
    return a.map(row=>b[0].map((_,j)=>row.reduce((s,v,k)=>s+v*b[k][j],0)));
  }
  function matmulState(row=0,col=0,step=0) {
    index(row,3,'row');index(col,2,'col');index(step,6,'step');
    const x=[[1,0,2,-1],[0,1,1,0],[2,1,0,1]],w=[[1,0],[0,1],[1,1],[-1,0]];
    const terms=x[row].map((v,k)=>({k,x:v,w:w[k][col],product:v*w[k][col]}));
    const revealed=Math.min(step,4);
    return {x,w,y:multiply(x,w),row,col,step,terms,revealed,partial:terms.slice(0,revealed).reduce((s,t)=>s+t.product,0)};
  }
  function headState(value=4,step=0) {
    index(value,12,'value');index(step,4,'step');
    const x=[range(3).map(t=>range(4).map(d=>4*t+d))];
    const split=[range(3).map(t=>range(2).map(h=>range(2).map(j=>x[0][t][2*h+j])))];
    const heads=[range(2).map(h=>range(3).map(t=>range(2).map(j=>split[0][t][h][j])))];
    const wrong=[range(2).map(h=>range(3).map(t=>range(2).map(j=>6*h+2*t+j)))];
    const t=Math.floor(value/4),d=value%4,h=Math.floor(d/2),j=d%2;
    return {x,split,heads,wrong,value,step,sourceIndex:[0,t,d],splitIndex:[0,t,h,j],headIndex:[0,h,t,j],wrongIndex:[0,Math.floor(value/6),Math.floor((value%6)/2),value%2]};
  }
  function attentionState(query=1,step=0) {
    index(query,3,'query');index(step,6,'step');
    const q=[[1,0],[0,1],[1,1]],k=[[1,0],[0,1],[1,1]],v=[[1,0],[0,2],[3,1]];
    const kt=k[0].map((_,j)=>k.map(row=>row[j]));
    const scores=multiply(q,kt),scaled=scores.map(row=>row.map(x=>x/Math.sqrt(2)));
    const masked=scaled.map((row,i)=>row.map((x,j)=>j<=i?x:-Infinity));
    const exponents=masked.map(row=>{const max=Math.max(...row);return row.map(x=>x===-Infinity?0:Math.exp(x-max));});
    const weights=exponents.map(row=>{const sum=row.reduce((a,b)=>a+b,0);return row.map(x=>x/sum);});
    return {q,k,kt,v,scores,scaled,masked,exponents,weights,output:multiply(weights,v),query,step};
  }
  function patchState(patch=0,element=0,step=0) {
    index(patch,4,'patch');index(element,4,'element');index(step,4,'step');
    const image=range(4).map(y=>range(4).map(x=>4*y+x));
    const maps=range(4).map(p=>range(4).map(e=>({p,e,y:2*Math.floor(p/2)+Math.floor(e/2),x:2*(p%2)+e%2})));
    const patches=maps.map(row=>row.map(m=>image[m.y][m.x]));
    return {image,maps,patches,patch,element,step,selected:maps[patch][element],value:patches[patch][element]};
  }
  function omniState(presence={image:true,audio:true,video:true},textPad=[false,false,false,false,false],selected=0,step=0) {
    index(selected,34,'selected');index(step,4,'step');
    if (textPad.length!==5) throw new Error('textPad must have length 5');
    const defs=[['cls',0,1],['text',1,6],['image',6,10],['audio',10,18],['video',18,34]];
    const groups=defs.map(([kind,start,end])=>({kind,start,end,count:end-start}));
    const tokens=groups.flatMap(g=>range(g.count).map(local=>({kind:g.kind,local,n:g.start+local,width:64,
      ignored:g.kind==='cls'?false:g.kind==='text'?Boolean(textPad[local]):!Boolean(presence[g.kind]),
      ...(g.kind==='video'?{frame:Math.floor(local/4),patch:local%4}:{}),
      ...(g.kind==='audio'?{samples:[32*local,32*(local+1)]}: {})})));
    return {groups,tokens,mask:tokens.map(t=>t.ignored),selected:tokens[selected],step,width:64,length:34,
      visibleKeys:tokens.filter(t=>!t.ignored).map(t=>t.n),sourceShape:[1,34,64],memoryShape:[1,34,64]};
  }
  globalThis.TensorEngine=Object.freeze({multiply,matmulState,headState,attentionState,patchState,omniState});
})();
</script>

    html+=readout(`选中 n=${t.n}：${t.kind}[${t.local}]`,`<div class="equation">source[0, ${t.n}, :] → memory[0, ${t.n}, :]</div><p>${esc(address)}</p>${step>=2?`<div class="equation">key_padding_mask[0,${t.n}] = ${t.ignored?'True → 不可读取此 KEY':'False → 可读取此 KEY'}</div>`:'<p>此时展示拼接地址；下一步查看读取权限。</p>'}`);
    if(step>=2)html+=`<p class="warning">key-padding mask 屏蔽的是 KEY 列，不会物理删除 token，也不会自动把它的输出行清零。即使原始缺失输入为 0，加上投影偏置、位置与类型向量后也不保证为 0。被屏蔽位置作为 query 仍可能算出向量，后续读取继续使用同一个 ignored mask。CLS 永远有效，避免所有 KEY 被屏蔽。</p>`;
    if(step===3)html+=`<div class="flow">编码器产生 memory [1,34,64] → 选择一个 token 切片</div><div class="grid">${card(`<h3>memory[0, ${t.n}, :] 的 64 个特征地址</h3><div class="feature-grid">${Array.from({length:64},(_,d)=>`<div class="feature">d${d}</div>`).join('')}</div><p>这里每格显示特征索引，不显示未经加载的参数值或激活值；向量内容由训练权重和输入共同决定。</p>`)}${card(`<h3>实际读取分支</h3><div class="equation">memory[:, 0, :] → [B,64]<br>→ image_head → [B,3,16,16]<br>→ audio_head → [B,256]<br>→ action_head → [B,4,2]</div><p>这三个连续头都只读 CLS；不会读取 teacher forcing 的目标 token。</p><div class="flow">另一条分支</div><div class="equation">decoder cross-attention<br>读取 memory 的 ${s.visibleKeys.length} 个有效 KEY</div><p>因果 mask 施加在回答序列上。共享源编码器本身不使用自回归因果 mask。</p>`)}</div>`;
    return html;
  }
  function render(){
    const sc=scenes[state.scene],step=state.steps[state.scene];
    $('scene-title').textContent=sc.title;$('scene-description').textContent=sc.description;$('scene-badge').textContent=sc.badge;
    document.querySelectorAll('[data-scene]').forEach(b=>{const active=Number(b.dataset.scene)===state.scene;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1;});
    $('workspace').setAttribute('aria-labelledby',`tab-${state.scene}`);
    $('step-list').innerHTML=sc.steps.map((label,i)=>`<li><button class="step-button" data-step="${i}" ${step===i?'aria-current="step"':''}><b>${i+1}</b>${label}</button></li>`).join('');
    $('previous').disabled=step===0;$('next').disabled=step===sc.steps.length-1;$('counter').textContent=`步骤 ${step+1} / ${sc.steps.length}`;
    $('stage').innerHTML=[matmulView,headView,attentionView,patchView,omniView][state.scene](step);
    $('live').textContent=`${sc.title}。步骤 ${step+1}，${sc.steps[step]}。`;
  }
  function focusAgain(selector){const item=document.querySelector(selector);if(item)item.focus({preventScroll:true});}
  document.querySelector('.scene-nav').addEventListener('click',e=>{const b=e.target.closest('[data-scene]');if(!b)return;state.scene=Number(b.dataset.scene);render();b.focus();});
  document.querySelector('.scene-nav').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();state.scene=e.key==='Home'?0:e.key==='End'?4:(state.scene+(e.key==='ArrowRight'?1:4))%5;render();focusAgain(`[data-scene="${state.scene}"]`);});
  $('previous').addEventListener('click',()=>{if(state.steps[state.scene]>0){state.steps[state.scene]--;render();}});
  $('next').addEventListener('click',()=>{if(state.steps[state.scene]<scenes[state.scene].steps.length-1){state.steps[state.scene]++;render();}});
  $('step-list').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b)return;state.steps[state.scene]=Number(b.dataset.step);render();focusAgain(`[data-step="${b.dataset.step}"]`);});
  $('stage').addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b)return;
    const {action,r,c,v}=b.dataset;
    if(action==='output'){state.row=Number(r);state.col=Number(c);}
    if(action==='value')state.value=Number(v);
    if(action==='query')state.query=Number(v);
    if(action==='pixel'){state.patch=2*Math.floor(Number(r)/2)+Math.floor(Number(c)/2);state.element=(Number(r)%2)*2+Number(c)%2;}
    if(action==='patch')state.patch=Number(v);
    if(action==='patch-element'){state.patch=Number(r);state.element=Number(c);}
    if(action==='token')state.token=Number(v);
    const selector=`[data-action="${action}"][data-v="${v}"]${r!==undefined?`[data-r="${r}"][data-c="${c}"]`:''}`;
    render();focusAgain(selector);
  });
  $('stage').addEventListener('change',e=>{if(e.target.dataset.presence){const k=e.target.dataset.presence;state.presence[k]=e.target.checked;render();focusAgain(`[data-presence="${k}"]`);}else if(e.target.id==='pad-toggle'){state.pad=e.target.checked;render();focusAgain('#pad-toggle');}});
  render();
})();
</script>
</body>
</html>
